# ── NATS JetStream Configuration ─────────────────────────────
# Used by: docker compose (htx-nats service)
# ──────────────────────────────────────────────────────────────

port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_mem_store: 256MB
  max_file_store: 1GB
}

# Logging
debug: false
trace: false
logtime: true
