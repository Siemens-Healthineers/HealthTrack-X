apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
        gzip_min_length 256;

        location /api/ {
            proxy_pass         http://htx-backend.healthtrack-x.svc.cluster.local:8000/api/;
            proxy_http_version 1.1;
            client_max_body_size 0;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
        }

        # SSE / AI chat stream (LLM can take minutes on CPU)
        location = /api/chat {
            proxy_pass         http://htx-backend.healthtrack-x.svc.cluster.local:8000/api/chat;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  30s;
            proxy_read_timeout     600s;
            proxy_send_timeout     600s;
        }

        location /api/chat/ {
            proxy_pass         http://htx-backend.healthtrack-x.svc.cluster.local:8000/api/chat/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Disable buffering for SSE
            proxy_buffering    off;
            proxy_cache        off;
            gzip               off;

            # Allow up to 10 min for model cold-start + full response on CPU
            proxy_connect_timeout  30s;
            proxy_read_timeout     600s;
            proxy_send_timeout     600s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
