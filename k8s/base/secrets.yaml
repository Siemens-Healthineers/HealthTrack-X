apiVersion: v1
kind: Secret
metadata:
  name: htx-secrets
  annotations:
    # INSECURE PLACEHOLDERS ONLY.
    # Do not deploy dev/prod without replacing these values or mounting them
    # from Azure Key Vault / another secret manager.
    # Recommended: Use Azure Key Vault CSI driver to inject secrets at runtime.
    # See: https://learn.microsoft.com/en-us/azure/aks/csi-secrets-store-driver
    description: "Placeholder – replace values or mount via Azure Key Vault CSI"
type: Opaque
stringData:
  # Keycloak Admin
  KC_ADMIN_USER: "admin"
  KC_ADMIN_PASSWORD: "CHANGE_ME"

  # Keycloak Backend Service Account
  # Used by both the Keycloak realm import and the backend Admin API client.
  KEYCLOAK_ADMIN_CLIENT_SECRET: "CHANGE_ME"

  # GitHub App
  GITHUB_BASE_URL: ""
  GITHUB_APP_ID: ""
  GITHUB_APP_INSTALLATION_ID: ""
  GITHUB_APP_PRIVATE_KEY: ""
  GITHUB_REPO: ""

  # GitHub OAuth
  OAUTH_GITHUB_CLIENT_ID: "CHANGE_ME"
  OAUTH_GITHUB_CLIENT_SECRET: "CHANGE_ME"

  # JWT Session Secret (generate: openssl rand -hex 32)
  JWT_SECRET: "CHANGE_ME"

  # Vault (optional)
  VAULT_URL: "http://vault.healthtrack-x.svc.cluster.local:8200"
  VAULT_TOKEN: "CHANGE_ME"
  VAULT_MOUNT_POINT: "secret"
  VAULT_BASE_PATH: "healthtrack-x"
