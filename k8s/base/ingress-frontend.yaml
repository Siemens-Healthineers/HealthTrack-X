apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: htx-frontend-ingress
  annotations:
    kubernetes.io/ingress.class: webapprouting.kubernetes.azure.com
spec:
  rules:
    - host: htx.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: htx-frontend
                port:
                  number: 80
