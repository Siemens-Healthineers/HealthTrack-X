apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: healthtrack-x

resources:
  - ../local

patches:
  - target:
      kind: ConfigMap
      name: htx-config
    patch: |
      - op: add
        path: /data/OLLAMA_URL
        value: "http://host.docker.internal:11434"
      - op: add
        path: /data/OLLAMA_CLASSIFY_MODEL
        value: "mistral:7b"
      - op: add
        path: /data/OLLAMA_CHAT_MODEL
        value: "mistral:7b"